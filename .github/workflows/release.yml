name: Release
on:
  push:
    # NOTE: Only semver tags, so that a tag for anything else, such as testing,
    # is not released. bin/github-release.sh would refuse it anyway.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: write
  # NOTE: This is needed to see whether the fonts are built from the commit
  # the tag points at.
  checks: read
jobs:
  release:
    runs-on: ubuntu-latest
    # NOTE: This waits for the build check of the commit when it is running.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # NOTE: The formula is committed into master, which is a protected
      # branch. Pushing with GITHUB_TOKEN is rejected, so use the same SSH key
      # as bin/github-generate-doc.sh does.
      - name: Load the deploy key
        run: bin/github-load-deploy-key.sh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
      - name: Create the release and update the formula
        run: bin/github-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
