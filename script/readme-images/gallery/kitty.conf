# The window the gallery is taken in: SF Mono Square in the colours of tokyonight storm
# (https://github.com/folke/tokyonight.nvim, extras/kitty/tokyonight_storm.conf).
background #24283b
foreground #c0caf5
selection_background #2e3c64
selection_foreground #c0caf5
url_color #73daca
cursor #c0caf5
cursor_text_color #24283b
active_tab_background #7aa2f7
active_tab_foreground #1f2335
inactive_tab_background #292e42
inactive_tab_foreground #545c7e
active_border_color #7aa2f7
inactive_border_color #292e42
color0 #1d202f
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6
color8 #414868
color9 #ff899d
color10 #9fe044
color11 #faba4a
color12 #8db0ff
color13 #c7a9ff
color14 #a4daff
color15 #c0caf5
color16 #ff9e64
color17 #db4b4b

font_size 16.0
font_family      family='SF Mono Square' style=Regular
bold_font        family='SF Mono Square' style=Bold
italic_font      family='SF Mono Square' style='Regular Italic'
bold_italic_font family='SF Mono Square' style='Bold Italic'
symbol_map U+20000-U+2A6DF,U+2A700-U+2EE5F,U+2F800-U+2FA1F SF Mono Square Ext P1
symbol_map U+30000-U+3347F SF Mono Square Ext P2
window_padding_width 8
background_opacity 1.0
tab_bar_style hidden
remember_window_size no
confirm_os_window_close 0
cursor_trail 0
hide_window_decorations titlebar-only
